<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BroadcastChannel Lab</title><link rel="stylesheet" href="/styles.css"></head><body><main><p class="eyebrow">BROWSER API LAB</p><h1>BroadcastChannel</h1><p>Open this page in multiple tabs. Messages stay within this browser origin.</p><section class="panel"><label>Channel name<input id="channel" value="lab-room"></label><button id="connect">Connect</button><button id="open">Open another tab</button><p id="state" role="status">Connecting…</p></section><section class="panel"><label>Your message<input id="message" maxlength="180" placeholder="Hello from this tab"></label><button id="send">Broadcast message</button></section><section class="panel"><h2>Message stream</h2><ol id="messages" aria-live="polite"></ol><button id="clear" class="secondary">Clear local view</button></section></main><script src="/app.js"></script></body></html>
